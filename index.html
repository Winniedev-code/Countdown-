<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anniversary Countdown</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #E6E6FA; /* Lavender background */
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      text-align: center;
      color: #4B0082;
    }

    h1 {
      margin-top: 50px;
      font-size: 3em;
    }

    p {
      font-size: 1.2em;
      margin: 20px auto;
      max-width: 600px;
    }

    .countdown {
      font-size: 2.5em;
      margin: 30px 0;
    }

    /* Heart style */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      transform: rotate(-45deg);
      animation-name: float;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: inherit;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 10px;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(-45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-1200px) rotate(-45deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>Happy Anniversary!</h1>
  <p>Counting down to the special day we started our journey together. 💜</p>
  <div class="countdown" id="countdown"></div>

  <script>
    // Real-time countdown to March 21
    const countdownEl = document.getElementById('countdown');
    const anniversaryDate = new Date("2026-03-21T00:00:00"); // March 21, 2026

    function updateCountdown() {
      const now = new Date();
      const diff = anniversaryDate - now;

      if (diff <= 0) {
        countdownEl.innerHTML = "🎉 Today is the special day! 🎉";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      countdownEl.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Floating hearts
    const colors = ['#FF69B4', '#FF1493', '#DB7093', '#BA55D3', '#9370DB', '#DA70D6'];

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');

      const size = 10 + Math.random() * 30; // random size 10-40px
      heart.style.width = size + 'px';
      heart.style.height = size + 'px';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      const color = colors[Math.floor(Math.random() * colors.length)];
      heart.style.backgroundColor = color;

      // Also set ::before and ::after to the same color
      heart.style.setProperty('--color', color);

      heart.style.animationDuration = 3 + Math.random() * 4 + 's'; // 3-7s
      heart.style.zIndex = 1000;

      document.body.appendChild(heart);

      // Remove heart after animation ends
      setTimeout(() => heart.remove(), 8000);
    }

    setInterval(createHeart, 200); // new heart every 0.2s
  </script>
</body>
</html>
