<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anniversary Countdown</title>
  <style>
    /* Global Styles */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Arial', sans-serif;
      background-color: #E6E6FA; /* Soft lavender */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #fff;
      text-align: center;
    }

    /* Container */
    .container {
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    /* Headline */
    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #fff;
      text-shadow: 1px 1px 10px rgba(0,0,0,0.2);
    }

    /* Countdown Timer */
    .countdown {
      font-size: 2rem;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .countdown div {
      background: rgba(255,255,255,0.2);
      padding: 15px 20px;
      border-radius: 12px;
      min-width: 80px;
      transition: transform 0.3s;
    }

    .countdown div:hover {
      transform: scale(1.1);
    }

    .countdown span {
      display: block;
      font-size: 1.2rem;
      margin-top: 5px;
      font-weight: bold;
    }

    /* Heart Styles */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #ff6b81;
      transform: rotate(-45deg);
      animation: floatUp linear infinite;
      border-radius: 0 50% 50% 50%;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #ff6b81;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 10px;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(-45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) rotate(-45deg);
        opacity: 0;
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }
      .countdown {
        font-size: 1.5rem;
      }
    }
    @media (max-width: 480px) {
      h1 {
        font-size: 1.5rem;
      }
      .countdown {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Counting the Days Until Our Love Anniversary ❤️</h1>
    <div class="countdown">
      <div><span id="days">0</span>Days</div>
      <div><span id="hours">0</span>Hours</div>
      <div><span id="minutes">0</span>Minutes</div>
      <div><span id="seconds">0</span>Seconds</div>
    </div>
  </div>

  <script>
    // Countdown Function
    const countdown = () => {
      const anniversaryDate = new Date('March 21, 2026 00:00:00').getTime();
      const now = new Date().getTime();
      const distance = anniversaryDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = days;
      document.getElementById('hours').innerText = hours;
      document.getElementById('minutes').innerText = minutes;
      document.getElementById('seconds').innerText = seconds;
    }

    setInterval(countdown, 1000);
    countdown();

    // Heart Animation
    const createHearts = () => {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.animationDuration = (5 + Math.random() * 5) + 's';
      heart.style.opacity = Math.random();
      heart.style.width = (10 + Math.random() * 20) + 'px';
      heart.style.height = heart.style.width;

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 10000); // remove after animation ends
    }

    setInterval(createHearts, 300);
  </script>
</body>
</html>
